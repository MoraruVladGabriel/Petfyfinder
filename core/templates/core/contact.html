{% extends 'core/base.html' %}

{% block title %}Contact{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto mt-10">
    <h1 class="text-3xl font-bold mb-6 text-center">Contact Us</h1>

    {% if messages %}
        <div class="mb-4">
            {% for message in messages %}
                <div class="p-4 mb-4 text-sm rounded-lg 
                    {% if message.tags == 'success' %}
                        bg-green-100 text-green-700
                    {% elif message.tags == 'error' %}
                        bg-red-100 text-red-700
                    {% elif message.tags == 'warning' %}
                        bg-yellow-100 text-yellow-700
                    {% elif message.tags == 'info' %}
                        bg-blue-100 text-blue-700
                    {% endif %}
                ">
                    {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}
    
    <form method="post" action="{% url 'core:contact' %}" class="bg-white p-8 shadow-md rounded-lg">
        {% csrf_token %}
        <div class="mb-4">
            <label for="name" class="block text-gray-700 font-semibold mb-2">Your Name</label>
            <input type="text" id="name" name="name" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" required>
        </div>
        <div class="mb-4">
            <label for="email" class="block text-gray-700 font-semibold mb-2">Your Email</label>
            <input type="email" id="email" name="email" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" required>
        </div>
        <div class="mb-4">
            <label for="message" class="block text-gray-700 font-semibold mb-2">Message</label>
            <textarea id="message" name="message" rows="5" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500" required></textarea>
        </div>
        <div class="text-center">
            <button type="submit" class="px-6 py-3 bg-teal-500 text-white font-semibold rounded-lg hover:bg-teal-700">Send Message</button>
        </div>
    </form>
</div>
{% endblock %}
