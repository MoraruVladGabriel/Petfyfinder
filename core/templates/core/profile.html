{% extends 'core/base.html' %}

{% block title %}Profile{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10 p-6 bg-white shadow-md rounded-lg">
    <h1 class="text-3xl font-bold mb-6 text-center">Profile</h1>
    
    <div class="mb-4">
        <label class="block text-gray-700 font-semibold">Username:</label>
        <p class="text-gray-700">{{ request.user.username }}</p>
    </div>
    
    <div class="mb-4">
        <label class="block text-gray-700 font-semibold">Email:</label>
        <p class="text-gray-700">{{ request.user.email }}</p>
    </div>
    
    <div class="mb-4">
        <label class="block text-gray-700 font-semibold">Location:</label>
        <p class="text-gray-700">{{ profile.location }}</p>
    </div>
    
    <div class="text-center">
        <a href="{% url 'core:profile_edit' %}" class="px-6 py-3 bg-teal-500 text-white font-semibold rounded-lg hover:bg-teal-700">Edit Profile</a>
    </div>
</div>
{% endblock %}
